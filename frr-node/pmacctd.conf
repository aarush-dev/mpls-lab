# pmacctd.conf — minimal IPFIX exporter for frr-node
# ponytail: NFACCTD_ADDR env var (default 172.20.20.53:2055) is substituted by
#           start.sh via envsubst before pmacctd reads this file; override at
#           container launch with -e NFACCTD_ADDR=<ip>:<port>.

daemonize: false
pcap_interface: any
# ingress only: the `any` pseudo-device delivers BOTH the ingress and the egress
# copy of a routed packet, which would double every byte/packet counter.
pcap_direction: in
pcap_filter: (ip or ip6) and not mpls

# `tos` must be listed HERE (not just in nfacctd.conf): the nfprobe plugin only
# populates primitives named on its own aggregate line, so without it the IPFIX
# ipClassOfService field — the DSCP/QoS class — exports as 0 forever.
# No in_iface: the `any` device has no ifindex, so it was 0 on every record.
aggregate: src_host, dst_host, src_port, dst_port, proto, tos

plugins: nfprobe[ipfix]

nfprobe_receiver[ipfix]: ${NFACCTD_ADDR}
nfprobe_version[ipfix]: 10
