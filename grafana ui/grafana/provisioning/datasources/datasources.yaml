# The app runs on client-side mock data (no metrics/log store), so no query
# datasource is provisioned. The one entry here is the local Alertmanager that
# backs the native Grafana Alerting UI: the plugin pushes synthetic node-down /
# prediction alerts to it through Grafana's datasource proxy
# (/api/alertmanager/noc-alertmanager/api/v2/alerts). A future "api" mode would
# add real query datasources — only once those services exist in the stack.
apiVersion: 1
datasources:
  # host.docker.internal pinned to the bridge gateway via extra_hosts in
  # docker-compose.yml; VM/Loki publish to host ports 8428/3100.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://host.docker.internal:8428
    isDefault: true
    jsonData:
      httpMethod: POST
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://host.docker.internal:3100
  - name: Alertmanager
    uid: noc-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    editable: false
