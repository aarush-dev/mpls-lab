! nfacctd — IPFIX/NetFlow collector. Listens udp/2055, prints flows to stdout
! so they are verifiable via `docker logs tele-nfacctd`. Producers (pmacctd on
! the FRR nodes) are repointed here by another agent.
nfacctd_ip: 0.0.0.0
nfacctd_port: 2055
!
plugins: print[stdout]
print_output: json
print_refresh_time: 30
print_history: 30s
!
! peer_src_ip = IPFIX exporter mgmt IP; label = device name via pre_tag_map.
! Every flow record carries both the raw exporter IP and the device label.
! No `tos`: frr-node/pmacctd.conf does not aggregate it, so the IPFIX templates
! carry no ToS field and the primitive would be a constant 0 on every record.
aggregate: src_host, dst_host, src_port, dst_port, proto, in_iface, peer_src_ip, label
!
! Maps exporter IP → device label. The map is generator-owned and mounted from
! topology/telemetry/device_map.txt (see telemetry/docker-compose.yml).
pre_tag_map: /etc/pmacct/device_map.txt
