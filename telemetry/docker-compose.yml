# =============================================================================
# Phase 2.1 — Telemetry stack for the sdwan_mpls_noc Containerlab lab.
# All services join the EXISTING clab docker network (external) so they share
# L2 with the FRR nodes (172.20.20.0/24) and get static mgmt IPs.
#
# AIR-GAP: every image is pinned to an explicit tag (no :latest). For offline
# deploy these must be pre-saved/loaded (Phase air-gap packaging:
#   docker save <img> | xz > img.tar.xz  →  docker load).
# =============================================================================
name: telemetry

networks:
  clab:
    external: true          # the Containerlab-managed bridge (docker network: "clab")

volumes:
  vm-data:
  grafana-data:
  loki-data:
  kafka-data:

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    pull_policy: never
    container_name: tele-victoriametrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    ports:
      - "8428:8428"
    networks:
      clab:
        ipv4_address: 172.20.20.50
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    pull_policy: never
    container_name: tele-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # AIR-GAP: grafana's defaults.ini enables all of these, so the container
      # would otherwise dial stats.grafana.org and grafana.com on a timer.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      clab:
        ipv4_address: 172.20.20.51
    depends_on:
      - victoriametrics
    restart: unless-stopped

  telegraf:
    image: telegraf:1.31.1
    pull_policy: never
    container_name: tele-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      clab:
        ipv4_address: 172.20.20.52
    depends_on:
      - victoriametrics
    restart: unless-stopped

  nfacctd:
    image: pmacct/nfacctd:v1.7.9
    pull_policy: never
    container_name: tele-nfacctd
    volumes:
      - ./nfacctd/nfacctd.conf:/etc/pmacct/nfacctd.conf:ro
      - ../topology/telemetry/device_map.txt:/etc/pmacct/device_map.txt:ro
    command: ["-f", "/etc/pmacct/nfacctd.conf"]
    ports:
      - "2055:2055/udp"
    networks:
      clab:
        ipv4_address: 172.20.20.53
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    pull_policy: never
    container_name: tele-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      # loki.yaml sets path_prefix /loki — without this volume every chunk and
      # index lives in the container layer and dies on recreate.
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      clab:
        ipv4_address: 172.20.20.54
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    pull_policy: never
    container_name: tele-promtail
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
    ports:
      - "1514:1514/tcp"
      - "1514:1514/udp"
    networks:
      clab:
        ipv4_address: 172.20.20.55
    depends_on:
      - loki
    restart: unless-stopped

  # --- SD-WAN controller (Phase 2.2) ----------------------------------------
  # Serves Prometheus text exposition on :9362. Telegraf already points to
  # http://172.20.20.56:9362/metrics (see telegraf/telegraf.conf).
  # docker.sock (ro) lets controller.py read live netem state from CE nodes via
  # `docker exec clab-sdwan_mpls_noc-<node> tc qdisc show dev eth1`.
  # Build: docker build -t noc-controller -f controller/Dockerfile . (from /root/LAB)
  controller:
    image: noc-controller:0.1   # pinned for air-gap; pre-loaded via load-offline.sh
    pull_policy: never
    container_name: noc-controller
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the SCALED spec over the image's baked-in copy so the controller
      # models the current topology, not the stale build-time spec. Relative to
      # this compose file — an absolute /root/LAB path makes docker silently
      # create an empty DIRECTORY on any host where the repo lives elsewhere.
      - ../topology-spec.yaml:/app/topology-spec.yaml:ro
    environment:
      DIURNAL_PERIOD: "3600"
      TOPO_SPEC: /app/topology-spec.yaml
      MEASURE_RTT: "1"   # ping hub wg0 IP per tunnel (background pool) for real RTT
    networks:
      clab:
        ipv4_address: 172.20.20.56
    restart: unless-stopped

  # --- LDP/BGP metrics pusher ------------------------------------------------
  # frr-snmp AgentX ABI mismatch → exec+vtysh path for MPLS MIBs.
  # Uses noc-controller image (has docker CLI + python). Loops every 30s,
  # runs ldp-metrics.sh, pushes Prometheus text to VM import API.
  # ponytail: reuses controller image; no new image build or air-gap update.
  # A failing push is left UNREDIRECTED on purpose: `docker logs noc-ldp-metrics`
  # is the only signal that the collector is dead (container stays Up either way).
  ldp-metrics:
    image: noc-controller:0.1
    pull_policy: never
    container_name: noc-ldp-metrics
    entrypoint: ["/bin/bash", "-c", "while true; do /app/ldp-metrics.sh 2>/dev/null | python3 -c \"import sys,urllib.request; urllib.request.urlopen('http://172.20.20.50:8428/api/v1/import/prometheus', data=sys.stdin.buffer.read())\"; sleep 30; done"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./telegraf/ldp-metrics.sh:/app/ldp-metrics.sh:ro
    networks:
      clab:
        ipv4_address: 172.20.20.58
    depends_on:
      - victoriametrics
    restart: unless-stopped

  # --- Device health / environmental metrics pusher --------------------------
  # Real: container CPU+memory, qdisc queue backlog/drops, BGP msg counters,
  # RIB size, OSPF LSDB size. Modelled: chassis temp/power/fan/PSU and SFF-8472
  # transceiver DOM (see telemetry/envmodel.py for the model provenance).
  # ponytail: same image + same push loop as ldp-metrics; nothing new to build.
  env-metrics:
    image: noc-controller:0.1
    pull_policy: never
    container_name: noc-env-metrics
    entrypoint: ["/bin/bash", "-c", "while true; do python3 /app/env-metrics.py 2>/dev/null | python3 -c \"import sys,urllib.request; urllib.request.urlopen('http://172.20.20.50:8428/api/v1/import/prometheus', data=sys.stdin.buffer.read())\"; sleep 30; done"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./env-metrics.py:/app/env-metrics.py:ro
      - ./envmodel.py:/app/envmodel.py:ro
      # env-metrics.py resolves topology-meta relative to its own parent dir;
      # at /app/env-metrics.py that lands on /topology/topology-meta.json.
      - ../topology/topology-meta.json:/topology/topology-meta.json:ro
    networks:
      clab:
        ipv4_address: 172.20.20.59
    depends_on:
      - victoriametrics
    restart: unless-stopped

  # --- Kafka broker (streaming fan-out) --------------------------------------
  # Single-broker KRaft mode: no Zookeeper container, no second config file.
  # Feeds two INDEPENDENT consumer groups (predictive + copilot) -- see
  # streaming/README.md. The bridge PRODUCER runs on the host next to dataapi
  # (it imports dataapi/export.py), so there is no extra image to build here.
  #
  # Two listeners on purpose: lab containers reach the broker at
  # 172.20.20.60:9092, host processes at 127.0.0.1:29092. A single listener
  # cannot serve both -- Kafka hands clients the ADVERTISED address after the
  # bootstrap connect, so a host client bootstrapped on 127.0.0.1 would be
  # redirected to an in-network address it cannot route to.
  kafka:
    image: apache/kafka:3.9.1
    pull_policy: never
    container_name: noc-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@172.20.20.60:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://172.20.20.60:9092,HOST://127.0.0.1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # bridge.py creates the four topics with explicit partitions + retention;
      # auto-create would silently give 1 partition and default retention, which
      # discards the per-device ordering design.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "noc-lab-kraft-cluster"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    networks:
      clab:
        ipv4_address: 172.20.20.60
    restart: unless-stopped

  # --- Traffic generator (Phase 2.2) -----------------------------------------
  # Drives real cross-site TCP flows between lab host containers via BusyBox nc
  # (wbitt/network-multitool:alpine-minimal ships nc but NOT iperf3).
  # docker.sock (ro) lets trafficgen.py run `docker exec <host> nc ...` to move
  # bytes across the MPLS/WireGuard overlay so ifHCIn/OutOctets climb and
  # nfacctd captures flows. Backend=nc; sim backend available for offline testing.
  # Build: docker build -t noc-trafficgen -f trafficgen/Dockerfile . (from /root/LAB)
  trafficgen:
    image: noc-trafficgen:0.1   # pinned for air-gap; pre-loaded via load-offline.sh
    pull_policy: never
    container_name: noc-trafficgen
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Same scaled-spec mount as controller so trafficgen drives flows across
      # all scaled sites, not just the build-time set.
      - ../topology-spec.yaml:/app/topology-spec.yaml:ro
    environment:
      DIURNAL_PERIOD: "3600"
      TRAFFICGEN_BACKEND: "nc"
      CLAB_LAB: "sdwan_mpls_noc"
      NC_PORT_BASE: "19000"
      NC_FLOW_SCALE: "0.05"
      TOPO_SPEC: /app/topology-spec.yaml
    networks:
      clab:
        ipv4_address: 172.20.20.57
    depends_on:
      - controller
    restart: unless-stopped
