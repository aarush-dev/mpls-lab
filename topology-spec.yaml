# =============================================================================
# topology-spec.yaml — SD-WAN-over-MPLS NOC lab declarative spec
# Generator (generate.py) reads this and emits: clab.yml, frr.conf (per node),
# daemons, snmpd.conf, wg configs, qos.sh.
#
# KNOBS: edit the counts/params below; everything else is derived.
# =============================================================================

# -----------------------------------------------------------------------------
# TOP-LEVEL KNOBS — change these to rescale the lab
# -----------------------------------------------------------------------------
knobs:
  # Provider core — POP-structured multi-area MPLS backbone
  p_count:  24         # P routers (LDP LSRs, OSPF-only, no BGP) = pop_count * p_per_pop
  pe_count: 12         # PE routers (LERs: OSPF+LDP+MP-BGP VPNv4+VRFs), 2 per POP
  pop_count: 6         # geographic POPs (each = one OSPF non-backbone area 1..pop_count)
  p_per_pop: 4         # P routers per POP: first 2 = ABRs (border, area 0), last 2 = PE-facing
  multi_area: true     # area-per-POP + area-0 inter-POP backbone (false = legacy single area 0)
  igp_cost_intra: 10   # OSPF cost on intra-POP links (cheap → SPF stays in-POP)
  igp_cost_inter: 100  # OSPF cost on inter-POP long-haul links (expensive transit)
  inter_pop_redundancy: 2          # parallel links per inter-POP adjacency (1 SRLG conduit)
  inter_pop_chords: [[1,4],[2,5],[3,6]]  # extra inter-POP adjacencies beyond the ring (diameter)

  # Customer sites — total CE nodes = branch + hub + dc
  branch_count: 24     # branch CEs  (small, single uplink, CORP+VOICE)
  hub_count:    6      # hub CEs     (regional, CORP+VOICE+GUEST, WG hub)
  dc_count:     4      # datacenter CEs (CORP+VOICE+GUEST, WG spoke)
  pe_dual_homing: true
  bfd_core: true
  hub_hub_wg: true
  route_reflector: true      # RR at pe_count=12 — C(12,2)=66 full-mesh → 23 RR sessions
  rr_nodes: [pe1, pe2]       # pe3..pe12 are RR clients
  # Option A — true per-VRF host separation: ONE host container per (site, VRF).
  #   branch=CORP,VOICE (2 hosts); hub/dc=CORP,VOICE,GUEST (3 hosts).
  #   hosts = branch*2 + hub*3 + dc*3 = 24*2 + 6*3 + 4*3 = 78.
  # Total containers = p_count + pe_count + (branch+hub+dc) + hosts
  #   = 24 + 12 + 34 + 78 = 148 containers.
  # (host count is DERIVED from each site's VRF membership; no per-site knob.)

  # BGP AS
  provider_as: 65000   # iBGP AS for all PEs
  # CE private ASNs: branch=65101+idx, hub=65201+idx, dc=65301+idx (see addressing)

  # Image
  # The FRR node image tag is NOT a knob — it is FRR_IMAGE in generate.py
  # ("frr-node:0.1", built FROM quay.io/frrouting/frr:10.5.1 by frr-node/Dockerfile),
  # because generate.py also shells into it to run `wg genkey`.
  host_image: "wbitt/network-multitool:alpine-minimal"

# -----------------------------------------------------------------------------
# UNDERLAY / OVERLAY — REFERENCE ONLY (not read by generate.py; the behaviour
# below is hardcoded in frr.conf.j2 + the 90-mpls.conf render). There is no
# vrflite fallback mode: MPLS/LDP is emitted unconditionally for every P/PE.
# -----------------------------------------------------------------------------
# Underlay: OSPF (area-per-POP + area-0 backbone), LDP on all core P-P and P-PE
# links with the loopback as transport address.
#   MPLS kernel requirements:
#     modules: mpls_router, mpls_gso, mpls_iptunnel
#     sysctl: net.mpls.platform_labels=1048575
#     per-iface: net.mpls.conf.<iface>.input=1  (core interfaces on P and PE)
# Overlay: PE-PE MP-BGP VPNv4. All PEs peer via loopback (update-source lo),
# family ipv4 vpn. RR on/off + RR node list live in knobs (read by generate.py).

# -----------------------------------------------------------------------------
# VRFs
# -----------------------------------------------------------------------------
# rd_community supplies the RT (`rt vpn both <value>`) on every PE. The RD is NOT
# this value — generate.py derives a per-PE RD (<pe_loopback>:<last field>) so
# identical customer prefixes from two sites stay distinct VPNv4 NLRIs.
# DSCP per class comes from qos.classes[].dscp below, not from here.
vrfs:
  CORP:
    rd_community: "65000:10"
    qos_priority: 2            # HTB class priority (lower = higher)
    sites: [branch, hub, dc]   # all site types get CORP

  VOICE:
    rd_community: "65000:20"
    qos_priority: 1            # highest priority
    sites: [branch, hub, dc]

  GUEST:
    rd_community: "65000:30"
    qos_priority: 3            # lowest priority
    sites: [hub, dc]           # branch sites do NOT get GUEST (YAGNI)

# Per-VRF CE-PE is eBGP (hardcoded in frr.conf.j2). CE advertises its LAN
# prefix(es) into the VRF; PE exports into VPNv4 with label vpn export auto.

# -----------------------------------------------------------------------------
# ADDRESSING PLAN
# generate.py derives every address from node indices, but the BASE PREFIXES are
# literals in generate.py — it reads only ce_asn_base, wg_overlay_subnet and
# wg_port from this block. Everything else here is REFERENCE DOCUMENTATION of
# what generate.py emits; editing those values has no effect.
# -----------------------------------------------------------------------------
addressing:
  # --- Loopbacks (router-ids) --- (reference)
  # Block 10.255.0.0/16 reserved for loopbacks; all /32.
  #   P  routers:  10.255.1.{1..p_count}/32
  #   PE routers:  10.255.2.{1..pe_count}/32
  #   CE branch:   10.255.3.{1..branch_count}/32
  #   CE hub:      10.255.4.{1..hub_count}/32
  #   CE dc:       10.255.5.{1..dc_count}/32
  loopback_base:
    P:      "10.255.1.0/24"     # .1 .. .24 (p_count)
    PE:     "10.255.2.0/24"     # .1 .. .12 (pe_count)
    CE_branch: "10.255.3.0/24"  # .1 .. .24 (branch_count)
    CE_hub:    "10.255.4.0/24"  # .1 .. .6  (hub_count)
    CE_dc:     "10.255.5.0/24"  # .1 .. .4  (dc_count)

  # --- Core P-P links (/31) ---
  # Block 10.0.0.0/16 for provider core point-to-point links.
  # Allocation: sequential /31s from 10.0.0.0.
  # Link numbering (generator enumerates all unordered pairs):
  #   P-P  links: 10.0.0.{2k}/31  for pair k (k=0,1,2 → 3 links for 3 P nodes full mesh)
  #   P-PE links: 10.0.1.{2k}/31  for the k-th P-PE connection
  # Each PE connects to at least one P; generator assigns round-robin P attachment.
  core_link_base:
    PP:   "10.0.0.0/16"   # /31s starting at 10.0.0.0
    PPE:  "10.0.1.0/16"   # /31s starting at 10.0.1.0

  # --- CE-PE links (/30) ---
  # One /30 per VRF per CE-PE connection, block 10.1.0.0/16.
  # Address formula: 10.1.{vrf_idx}.{site_linear_idx*4}/30
  #   vrf_idx: CORP=0, VOICE=1, GUEST=2
  #   site_linear_idx: global sequential index across branch/hub/dc
  # Within the /30: .1 = PE (VRF interface), .2 = CE
  ce_pe_link_base: "10.1.0.0/16"

  # --- Customer LAN subnets (behind host containers) — Option A, per (site,VRF) ---
  # Block 192.168.0.0/16. Each (site,VRF) pair gets its OWN /24 so a host in
  # CORP is a different subnet from a host in VOICE at the same site.
  # Formula: 192.168.{site_linear_idx*4 + vrf_idx}.0/24
  #   vrf_idx: CORP=0, VOICE=1, GUEST=2  (slot 3 of each block of 4 is spare)
  #   host gets .10/24, CE gets .1/24 as gateway.
  # Collision-free: per-site third-octet ranges [4i, 4i+2] are disjoint (gap of 4).
  # Max octet with 34 sites = 33*4+2 = 134 < 256. (selftest --check asserts this.)
  customer_lan_base: "192.168.0.0/16"

  # --- BGP ASNs for CEs ---
  # branch CE{i}: AS 65101 + (i-1)     → 65101 .. 65124 (24 branches)
  # hub    CE{i}: AS 65201 + (i-1)     → 65201 .. 65206 (6 hubs)
  # dc     CE{i}: AS 65301 + (i-1)     → 65301 .. 65304 (4 dc)
  ce_asn_base:
    branch: 65101
    hub:    65201
    dc:     65301

  # --- WireGuard overlay ---
  # Subnet 172.16.0.0/24; all WG peers in this /24.
  # Hubs get .1..(hub_count); branch spokes .11+idx; dc spokes .101+idx.
  # ponytail: at branch_count=24 the branch block runs .11..35, which would
  # overrun a .21-based dc block — so dc base was moved to .101 (in generate.py)
  # to keep the two spoke ranges disjoint. selftest --check asserts no collision.
  wg_overlay_subnet: "172.16.0.0/24"
  wg_port: 51820

# -----------------------------------------------------------------------------
# SD-WAN OVERLAY (WireGuard hub-spoke) — REFERENCE ONLY (not read by generate.py)
# -----------------------------------------------------------------------------
# Hub-spoke, no spoke-spoke shortcuts. All 6 hub CEs are WireGuard concentrators
# (172.16.0.1 .. .6); every branch and dc CE is a spoke peering to ALL hubs
# (branch 172.16.0.11 .. .34, dc 172.16.0.101 .. .104). hub_hub_wg in knobs adds
# a tunnel between adjacent hub pairs.
# Keys are generated once at generate.py time (`wg genkey` inside frr-node:0.1),
# cached in generator/.wg-keys.json, and written into per-node wg0.conf.

# -----------------------------------------------------------------------------
# QOS
# -----------------------------------------------------------------------------
qos:
  # Applied on CE egress toward PE, on every per-VRF uplink. tc HTB root; the
  # uplink's own VRF class is the HTB default (one VRF per uplink), so there is
  # no DSCP marking or DSCP-matching filter anywhere — `dscp` below is a label.
  classes:
    - vrf: VOICE
      dscp: EF          # 46
      bandwidth_pct: 30  # guaranteed 30% of CE uplink
      burst_pct:     10
    - vrf: CORP
      dscp: AF31        # 26
      bandwidth_pct: 50
      burst_pct:     20
    - vrf: GUEST
      dscp: BE          # 0
      bandwidth_pct: 20  # best-effort remainder
      burst_pct:     5
  # CE uplink rate (used as HTB root rate); override per site_type if needed.
  default_uplink_rate: "1gbit"

# -----------------------------------------------------------------------------
# TELEMETRY HOOKS (hints for later phases — not consumed by generate.py)
# -----------------------------------------------------------------------------
telemetry:
  snmp:
    community: "public"
    agentx: true         # FRR AgentX → snmpd; requires "agentx" in frr.conf
  pmacct:
    protocol: ipfix
    port: 4739
  syslog:
    level: informational
    bgp_log_neighbor_changes: true
  # frr-node/start.sh runs snmpd AND pmacctd on every FRR container (P, PE, CE);
  # there is no per-role selection.

# -----------------------------------------------------------------------------
# SITE TOPOLOGY MAP — REFERENCE ONLY (hardcoded in generate.py)
# Each CE attaches to exactly one PE, round-robin across pe_count:
#   pe_index = (site_linear_idx % pe_count) + 1
