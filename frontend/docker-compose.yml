# Local Grafana runtime for the mplslab-noccopilot-app plugin.
#
# MOCK MODE, AIR-GAPPED: this stack runs Grafana alone, with no lab
# network, no backend service, and no datasource. The app plugin is
# expected to generate its own mock data client-side. Nothing here
# reaches out to the network.
#
# The plugin is unsigned, so it is allow-listed explicitly via
# GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS and bind-mounted in from
# ./plugin/dist (built by a separate process, not by this compose file).
services:
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mplslab-noccopilot-app
      GF_DEFAULT_APP_MODE: development
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./plugin/dist:/var/lib/grafana/plugins/mplslab-noccopilot-app
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
