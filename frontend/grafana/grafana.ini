# Custom Grafana config (merged over defaults.ini; GF_* env vars still win).
# Hoists the NOC Copilot app's pages OUT of the "Apps" nav section and up to the
# top level of the left navigation (alongside Starred / Dashboards), one nav item
# per page. Each key is a plugin page path (matches an `includes` entry in
# plugin.json); value is "<section id> <sort weight>".
[navigation.app_standalone_pages]
/a/mplslab-noccopilot-app/ = dashboards 100
/a/mplslab-noccopilot-app/topology = dashboards 101
/a/mplslab-noccopilot-app/node/pe1 = dashboards 102
/a/mplslab-noccopilot-app/telemetry = dashboards 103
/a/mplslab-noccopilot-app/incidents = dashboards 104
/a/mplslab-noccopilot-app/copilot = dashboards 105
/a/mplslab-noccopilot-app/status = dashboards 106
